# finrag 检索评估黄金集（Golden Set）
# -----------------------------------------------------------------------------
# 用途：量化检索质量，作为"优化依据"与"回归门禁"。
# 两套命中口径（compare.py 双指标输出）：
#   1. 文档级：检索 Top-k 是否命中 expected_sources 之一（"能否召回答案所在文档"）
#   2. 答案级：期望 answer 片段是否真实出现在召回 chunk 的文本中
#      （"喂给 LLM 的上下文里，答案是否真的出现"，更严格）
# 结构：
#   query            用户问题（检索输入原文）
#   expected_sources 期望命中的来源文档（短文件名）
#   answer           期望答案的唯一片段（须与文档原文子串一致，用于答案级判定）
#   type             用例类型：
#     - direct   关键词直接命中（验证基线不会坏）
#     - semantic 依赖语义理解，关键词弱相关（验证语义召回）
#     - fuzzy    易混淆/冷门表述（验证精排区分度）
#   note             备注（面试讲解时可用）
# -----------------------------------------------------------------------------

- query: "华信科技2024年营业收入是多少？同比增长多少？"
  expected_sources: ["2024年年报摘要-华信科技.txt"]
  answer: "96.8 亿元"
  type: direct
  note: "年报核心数字"

